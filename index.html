<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tauten</title>
<meta name="description" content="A strictness profile for Rust written by AI agents.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#F7F5F1;--ink:#1B2230;--muted:#5B6372;--accent:#C8552D}
@media (prefers-color-scheme: dark){:root{--bg:#141922;--ink:#ECE8E1;--muted:#A3A9B4;--accent:#E8774E}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
main{max-width:34rem;text-align:center}
h1{font-size:2.4rem;letter-spacing:-.02em;margin:.4em 0 .2em}
p{color:var(--muted);margin:.4em 0}
a{color:var(--accent)}
.dark{display:none}
@media (prefers-color-scheme: dark){.light{display:none}.dark{display:inline}}
</style>
</head>
<body>
<main>
<img class="light" src="/assets/tauten-icon.svg" width="96" height="96" alt="">
<img class="dark" src="/assets/tauten-icon-dark.svg" width="96" height="96" alt="">
<h1>tauten</h1>
<p>A strictness profile for Rust written by AI agents.</p>
<p>Pre-release. The site is being built.</p>
</main>
</body>
</html>
