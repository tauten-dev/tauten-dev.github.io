# Site configuration. build.py and capture.py read this file.

# The core repository and the exact commit the site is built from. Every core
# file is read with `git show <core_ref>:<path>`, never from the working tree.
# Both can be overridden on the command line (--core, --core-ref).
core = "../tauten"
core_ref = "b8640f6b7b27c851c4dd8330205007321abbdcdc"

site_url = "https://tauten.dev"
domain = "tauten.dev"
repository = "tauten-dev/tauten"
site_repository = "tauten-dev/tauten-dev.github.io"

# Release switch. While false:
#   - the install step shows `cargo install --locked cargo-tauten` with a note
#     that it works from the first release (0.0.1), and no git-URL install;
#   - links into github.com/tauten-dev/tauten are rendered as plain paths,
#     because the repository is private until that release.
# Set it to true once 0.0.1 is on crates.io and the repository is public.
published = false
first_release = "0.0.1"
