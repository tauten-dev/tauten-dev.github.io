# Site configuration. build.py and capture.py read this file.

# The core repository and the exact commit the site is built from. Every core
# file is read with `git show <core_ref>:<path>`, never from the working tree.
# Both can be overridden on the command line (--core, --core-ref).
core = "../tauten"
core_ref = "719d4e982a4e6d0d778d6fea2c71025323d638a1"

site_url = "https://tauten.dev"
domain = "tauten.dev"
repository = "tauten-dev/tauten"
site_repository = "tauten-dev/tauten-dev.github.io"

# Release switch: the crates are on crates.io. When true, the install step
# shows `cargo install --locked cargo-tauten` plainly and crate cards link to
# crates.io and docs.rs. When false, the command carries a note that it works
# from the first release, and there are no crates.io or docs.rs links.
published = true
first_release = "0.0.1"
latest_release = "0.1.0"

# Source switch: tauten-dev/tauten is public. While false, paths into
# the core repository are shown as plain text, with no github.com links, and
# the GitHub nav and footer links are left out. Set true once it is public.
repo_public = true
