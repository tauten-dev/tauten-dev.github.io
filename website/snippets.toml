# Code excerpts pulled from the core repository at the pinned commit.
# `start` is an exact line that must occur once in the file; `end` is the
# first exact line at or after it. Optional: `before`/`after` extend the
# excerpt by whole lines, `strip` removes a prefix, `dedent` removes common
# indentation. Line numbers are never used to locate code.

# --- home, example 1: authority is a parameter (TAU-A001)
[ambient-clock]
path = "fixtures/cases/rej-ambient-clock/src/lib.rs"
start = "pub fn now() -> std::time::SystemTime {"
end = "}"
lang = "rust"

[effects-age]
path = "fixtures/cases/acc-effects/src/lib.rs"
start = "#[effects(clock)]"
end = "}"
lang = "rust"

# --- home, example 2: declared effects match the signature (TAU-F001)
[effects-load]
path = "fixtures/cases/rej-effects/src/lib.rs"
