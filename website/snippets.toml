# --- home, example 3: a proof replaces a finding
[sub-add-capped]
path = "fixtures/proofs-subsume/sub-kernel/src/lib.rs"
start = "pub fn add_capped(a: u32, b: u32) -> u32 {"
end = "}"
lang = "rust"

[sub-double]
path = "fixtures/proofs-subsume/sub-kernel/src/lib.rs"
start = "pub fn double(a: u32) -> u32 {"
end = "}"
