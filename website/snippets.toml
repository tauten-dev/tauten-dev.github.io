# Code excerpts pulled from the core repository at the pinned commit.
# `start` is an exact line that must occur once in the file; `end` is the
# first exact line at or after it. Optional: `before`/`after` extend the
# excerpt by whole lines, `strip` removes a prefix, `dedent` removes common
# indentation. Line numbers are never used to locate code.

