[sub-theorem]
path = "fixtures/proofs-subsume/proofs/Proofs/SubKernel.lean"
start = "theorem add_capped_spec (a b : U32) :"
end = "    add_capped a b ⦃ r => r.val = min (a.val + b.val) U32.max ⦄ := by"
lang = "lean"

# --- start
[tier-manifest]
path = "README.md"
start = "[package.metadata.tauten]"
end = 'tier = "core"   # "kernel" | "core" | "edge"'
lang = "toml"

[check-commands]
path = "README.md"
start = "$ cargo tauten check                 # human output"
end = "$ cargo tauten explain TAU-A001      # why the rule exists and how to fix it"
lang = "text"

[proof-commands]
path = "README.md"
start = "$ cargo tauten init --proofs my-kernel --write   # writes proofs/ (claims.toml, gate, Lean project)"
end = "$ cargo tauten proofs                            # run the gate; one JSON outcome per claim"
lang = "text"

# --- start, adoption routes (docs/ADOPTING.md)
[adopt-advisory]
path = "docs/ADOPTING.md"
start = "$ rustup toolchain install 1.98.0 --profile minimal --component clippy"
end = "$ git status --short                                          # prints nothing"
lang = "text"

[adopt-ci]
path = "docs/ADOPTING.md"
start = "$ cargo +1.98.0 tauten init --write      # tiers, AGENTS.tauten.md, [profile.release] overflow-checks"
end = "$ cargo +1.98.0 tauten check             # in CI: structure and Clippy, against the committed baseline"
lang = "text"

# --- proofs, reusing one Lean module (docs/ADOPTING.md)
[reuse-lean]
path = "docs/ADOPTING.md"
start = "$ TAUTEN=370e7050f2adaba1e0a1c7351ab686d5f1238c47   # tauten 0.2.0"
end = "Proofs/TautenMachine.LICENSE: OK"
lang = "text"

[reuse-sha]
path = "docs/ADOPTING.md"
start = "73a648f123876f2c3ae43610ddeac683061906d26b8ccc3b6cd297743bbe07f3  Proofs/TautenMachine.lean"
end = "bb23cea06c1a4f205b5f6e2d4ecc5ff1c1ebf15829706f1fe366424d0919e9be  Proofs/TautenMachine.LICENSE"
lang = "text"
