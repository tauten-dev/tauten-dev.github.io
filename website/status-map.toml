# Site item -> one row of the milestone table in docs/STATUS.md, matched by
# milestone and a substring of the Item cell. Badges come only from here.

[cargo-tauten]
milestone = "M1"
item_contains = "cargo tauten check"

[init]
milestone = "M1"
item_contains = "`init`"

[ratchet]
milestone = "M1"
item_contains = "Ratchet"

# tauten-check has no row of its own; its analysis is what the fixture suite
# exercises, and that row says so.
[tauten-check]
milestone = "M0"
item_contains = "Fixtures"

[rule-table]
milestone = "M0"
item_contains = "rule table"

[tauten]
milestone = "M2"
item_contains = "`tauten`:"

[tauten-macros]
milestone = "M2"
item_contains = "`tauten-macros`"

[dry-run]
milestone = "M0b"
item_contains = "Writfold dry run"

[proof-tier]
milestone = "M3"
item_contains = "Proof tier"

[bench-harness]
milestone = "M4"
item_contains = "Benchmark harness"

[bench-pilot]
milestone = "M4"
item_contains = "Pilot with a real agent"

[publication]
milestone = "M5"
item_contains = "release workflow"

[writfold]
milestone = "M8"
item_contains = "Writfold adoption"
